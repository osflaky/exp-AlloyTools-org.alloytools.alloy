name: build

on:
  workflow_dispatch:

env:
  LC_ALL: en_US.UTF-8
  REPOSITORY_USERNAME: ${{ secrets.REPOSITORY_USERNAME }}
  REPOSITORY_PASSWORD: ${{ secrets.REPOSITORY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest--arm64
    name: build on OpenJDK Linux (just changing name for testing with new 
      commit) [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
          # Temurin does not publish JDK 17 for Windows on ARM64; use the
          # Microsoft Build of OpenJDK there, which does.
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
    - shell: bash
      run: ./gradlew --parallel build
    - if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.os }}-${{ matrix.arch }}
        path: '*/target/reports'

    timeout-minutes: 150
