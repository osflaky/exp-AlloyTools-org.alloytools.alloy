name: build

on:
  workflow_dispatch:

env:
  LC_ALL: en_US.UTF-8
  REPOSITORY_USERNAME: ${{ secrets.REPOSITORY_USERNAME }}
  REPOSITORY_PASSWORD: ${{ secrets.REPOSITORY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: build on OpenJDK Linux (just changing name for testing with new 
      commit) [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - shell: bash
      run: ./gradlew --parallel build
    - if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '*/target/reports'

    timeout-minutes: 150
